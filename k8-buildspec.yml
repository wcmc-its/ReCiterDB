---
version: 0.2
phases:
  install:
    commands:
      - kubectl version --client # removed --short flag 
  pre_build:
      commands:
        # Fetch Docker credentials from AWS Secrets Manager
        - echo "Fetching Docker credentials from AWS Secrets Manager"
        - SECRET=$(aws secretsmanager get-secret-value --secret-id docker-hub-credentials --query "SecretString" --output text)
      
        # Extract username and password from the JSON response
        - DOCKER_USERNAME=$(echo $SECRET | sed -n 's/.*"username":"\([^"]*\)".*/\1/p')
        - DOCKER_PASSWORD=$(echo $SECRET | sed -n 's/.*"password":"\([^"]*\)".*/\1/p')
      
        # Print the Docker username to the CodeBuild log
        - echo "Docker Username $DOCKER_USERNAME"
        
        # Log in to Docker registry
        - echo "Logging in to Docker registry"
        - echo "$DOCKER_PASSWORD" | docker login --username $DOCKER_USERNAME --password-stdin
        - TAG="${BRANCH}-$CODEBUILD_BUILD_NUMBER.$(date +%Y-%m-%d.%H.%M.%S).$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | head -c 8)"
        - echo $TAG
        - sed -i.bak -e 's@CONTAINER_IMAGE@'"$REPOSITORY_URI:$TAG"'@' kubernetes/k8-cronjob.yaml
        - echo "${CODEBUILD_WEBHOOK_HEAD_REF}"
        - echo "${BRANCH}"

        # Deploying (push + repoint the live cronjob) is allowed ONLY for builds the
        # CodePipeline started. BRANCH and CRON_JOB_NAME are set by the pipeline's Build
        # action, NOT by the project: the project-level default is BRANCH=dev with no
        # CRON_JOB_NAME at all. So a manual `aws codebuild start-build --source-version
        # <any-branch>` used to inherit BRANCH=dev, satisfy the ".*dev" test below, and
        # push an image built from that branch into the PROD ECR repo under a dev-* tag.
        # Gate on the initiator so a manual start can never reach a push or a kubectl.
        - |
          case "$CODEBUILD_INITIATOR" in
            codepipeline/*) DEPLOY=yes ;;
            *)              DEPLOY=no ;;
          esac
          if [ "$DEPLOY" = yes ]; then
            expr "${BRANCH}" : ".*master" >/dev/null || expr "${BRANCH}" : ".*dev" >/dev/null || DEPLOY=no
            [ -n "${CRON_JOB_NAME}" ] || { echo "CRON_JOB_NAME is empty -- refusing to deploy"; DEPLOY=no; }
          fi
          echo "initiator=${CODEBUILD_INITIATOR} branch=${BRANCH} cronjob=${CRON_JOB_NAME:-<unset>} deploy=${DEPLOY}"
          export DEPLOY
        - echo $REPOSITORY_URI
        - echo "${AWS_REGION}"
        
        # - $(aws ecr get-login --no-include-email)
        - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
  build:
    commands:
      # Always build. It has no side effects, and it is the only real validation this
      # buildspec performs -- a manual start-build is now a genuine image dry-run.
      - docker build --tag $REPOSITORY_URI:$TAG .
  post_build:
    commands:
      - |
        if [ "$DEPLOY" = yes ]; then
          docker push $REPOSITORY_URI:$TAG
          # Log out from the Docker registry to clear credentials
          docker logout $REPOSITORY_URI
          aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region us-east-1 --role-arn $EKS_KUBECTL_ROLE_ARN
          kubectl set image cronjob/$CRON_JOB_NAME $CRON_JOB_NAME=$REPOSITORY_URI:$TAG -n reciter
          # CRON_JOB_NAME carries a single name, so the identity cronjob would
          # otherwise stay pinned at whatever tag it was applied with while
          # reciterdb moved on -- silently running stale code, the way
          # reciter-scopus-prod sat 238 days old. Same image, same tag; skipped
          # without error if the cronjob has not been applied yet.
          if kubectl -n reciter get cronjob reciterdb-identity >/dev/null 2>&1; then
            kubectl set image cronjob/reciterdb-identity \
              reciterdb-identity=$REPOSITORY_URI:$TAG -n reciter
          fi
        else
          echo "Not a pipeline-initiated deploy (initiator=${CODEBUILD_INITIATOR}, branch=${BRANCH})."
          echo "Image built and discarded; nothing pushed, cronjob untouched."
        fi
