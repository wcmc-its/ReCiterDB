# Credentials for the Identity Authority database, used by
# update/buildIdentityAuthority.py via the reciterdb-identity-authority cronjob.
#
# TEMPLATE ONLY -- placeholders, never real values. Same convention as
# k8-secrets.yaml in this directory. Fill a COPY outside the repo and apply that,
# or use the `kubectl create secret` form below, which keeps the values out of
# any file at all.
#
# WHERE THE VALUES COME FROM
# The Identity Authority database is NOT on the reciterdb MariaDB server --
# verified 2026-09-06: no schema on ip-172-17-5-73 contains _person_canonical.
# The only known record of its host and account is Splunk's DB Connect
# connection named `Identity_Authority`:
#   Splunk -> Settings -> Data inputs -> DB Connect -> Configuration ->
#   Databases -> Connections -> Identity_Authority
# That page gives host, port, database name and the account. The password is
# stored encrypted there and will not display; it has to come from wherever it
# was originally recorded.
#
# PREFER THE IMPERATIVE FORM. `kubectl apply` writes the whole manifest --
# secret values included -- into the object's
# kubectl.kubernetes.io/last-applied-configuration annotation, where anyone with
# read access to the Secret can see it in cleartext. `kubectl create` does not.
#
#   kubectl -n reciter create secret generic identity-authority-secrets \
#     --from-literal=IA_DB_HOST='<host>' \
#     --from-literal=IA_DB_NAME='<database>' \
#     --from-literal=IA_DB_USERNAME='<user>' \
#     --from-literal=IA_DB_PASSWORD='<password>'
#
# Better still, keep the password out of shell history by putting the four
# KEY=value lines in a file with no trailing spaces and running:
#
#   kubectl -n reciter create secret generic identity-authority-secrets \
#     --from-env-file=/path/to/ia.env
#   shred -u /path/to/ia.env      # or rm, on macOS
#
# To rotate later, delete and recreate -- do not `apply` over it:
#   kubectl -n reciter delete secret identity-authority-secrets
#
# VERIFY WITHOUT PRINTING THE VALUES:
#   kubectl -n reciter get secret identity-authority-secrets \
#     -o jsonpath='{range $k,$v := .data}{$k}{"\n"}{end}'
# That lists key names only. Never `-o yaml` a Secret you do not want echoed.
apiVersion: v1
kind: Secret
metadata:
  name: identity-authority-secrets
  namespace: reciter
  labels:
    app: reciterdb-identity-authority
    environment: production
    tier: backend
    owner: its-reciter
type: Opaque
stringData:
  IA_DB_HOST: REPLACE_ME
  IA_DB_NAME: REPLACE_ME
  IA_DB_USERNAME: REPLACE_ME
  IA_DB_PASSWORD: REPLACE_ME
