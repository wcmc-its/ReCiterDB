apiVersion: batch/v1
kind: CronJob
metadata:
  name: reciterdb
  namespace: reciter
  labels:
    app: reciterdb
    tier: backend
    owner: szd2013
spec:
  # Matches the live prod object so `kubectl apply` is a no-op. Do NOT change the
  # schedule here without changing it live — this is the sole source of truth.
  schedule: "30 14 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: reciterdb
            # Substituted at build time by the ReCiterDB pipeline (set-image); a raw
            # apply of this file would set the literal string CONTAINER_IMAGE — build
            # first, or patch the image separately.
            image: CONTAINER_IMAGE
            env:
            # AAR lane switches read by run_all.py. Both are set on the live CronJob;
            # keep them here so a manual apply of this file doesn't turn the lanes off.
            - name: AAR_SCOPUS_ITHACA_LANE
              value: "on"
            - name: AAR_OPENALEX_LANE_CADENCE
              value: "weekly"
            # Venue categories for the external lanes (infer_venue_subfield.py). Ships off.
            # Before turning it on: apply setup/alter_venue_fit_v3.14.sql, and add
            # bedrock:InvokeModel on the Claude Haiku inference profile and its foundation
            # model to the reciterdb role.
            - name: AAR_VENUE_INFER
              value: "off"
            # AAR_VENUE_FIT (the matcher's venue term, Cornell Ithaca only) is deliberately NOT
            # listed: it ships off and is turned on live with `kubectl set env`, after v3.14
            # and a read of backfill_venue_fit.py's dry run.
            # AAR_BYLINE_ORCID (the external lanes store the byline author's ORCID and Scopus
            # author id, and on a Cornell Ithaca byline rank the person that ORCID is on file
            # for first) is likewise NOT listed: it ships off and is turned on live with
            # `kubectl set env`, after setup/alter_authorship_review_add_byline_orcid_v3.15.sql
            # and a read of backfill_byline_orcid.py's dry run. On, the Scopus lanes ask
            # OpenAlex for the ORCIDs Scopus does not carry, one call per 50 DOIs, using
            # OPENALEX_MAILTO below.
            # AAR_BYLINE_ORCID_PUBMED (the PubMed lane does the same: PubMed's own byline
            # ORCID, else OpenAlex's by DOI, and the person it is on file for ranks first) is
            # NOT listed either: it ships off, needs AAR_BYLINE_ORCID, and is turned on live
            # with `kubectl set env` after a read of `backfill_byline_orcid.py --pubmed`'s
            # dry run.
            # AAR Scopus + PubMed lanes (weekly, gated in run_all.py)
            - name: SCOPUS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: scopus-secret
                  key: SCOPUS_API_KEY
            - name: SCOPUS_INST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: scopus-secret
                  key: SCOPUS_INST_TOKEN
            - name: PUBMED_API_KEY
              valueFrom:
                secretKeyRef:
                  name: pubmed-secret
                  key: PUBMED_API_KEY
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: reciterdb-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reciterdb-secrets
                  key: DB_PASSWORD
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: reciterdb-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: reciterdb-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: URL
              valueFrom:
                secretKeyRef:
                  name: reciterdb-secrets
                  key: URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: reciterdb-secrets
                  key: API_KEY
            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: AWS_DEFAULT_REGION
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: DB_HOST
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: DB_NAME
            - name: LOG_FILE
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: LOG_FILE
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: S3_BUCKET
            - name: S3_KEY_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: S3_KEY_PREFIX
            # OpenAlex polite-pool contact for externalAbstractImport.py, the AAR OpenAlex lane
            # and enrichArticles.py (5e). optional: the key may be absent from the configmap.
            # ARTICLE_ENRICHMENT (off|dry-run|apply) is deliberately NOT listed: it ships off
            # and is turned on live with `kubectl set env` (see the v3.9 migration header).
            - name: OPENALEX_MAILTO
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: OPENALEX_MAILTO
                  optional: true
            # Its own daily OpenAlex budget instead of the one keyless calls share per egress
            # IP (the same secret as reciterdb-web-seeds). Optional: absent, calls go keyless.
            - name: OPENALEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openalex-api
                  key: OPENALEX_API_KEY
                  optional: true
            # Contact address sent with every NCBI E-utilities call. Unset, the AAR lanes
            # and collectAffiliations.py fall back to the default in aar_universe.py, which
            # is a personal address: add an institutional NCBI_EMAIL to reciterdb-configmap.
            - name: NCBI_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: reciterdb-configmap
                  key: NCBI_EMAIL
                  optional: true
            # Research-security collection (collectAffiliations.py, v3.13) also uses
            # OPENALEX_MAILTO, NCBI_EMAIL and PUBMED_API_KEY above. RESEARCH_SECURITY_MODE
            # (off|dry-run|apply) is deliberately NOT listed: it ships off and is turned on
            # live with `kubectl set env` (see the v3.13 migration header). Optional knobs,
            # set the same way: RESEARCH_SECURITY_TIMEOUT_SECONDS (default 3600) and
            # RESEARCH_SECURITY_MAX_HTTP_CALLS (default 500 efetch/OpenAlex batches a run).
            # - name: RESEARCH_SECURITY_MODE
            #   value: "dry-run"
          restartPolicy: OnFailure
